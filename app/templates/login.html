{% extends 'base.html' %}{% block title %}Đăng nhập · CineVista{% endblock %}{% block content %}<div class="login-card mx-auto p-4 p-md-5 rounded-4"><span class="text-warning small fw-bold text-uppercase">Welcome back</span><h1 class="h2 mt-2">Bắt đầu trải nghiệm</h1><p class="text-secondary">Đăng nhập để chọn ghế và quản lý vé của bạn.</p><form id="login-form" class="mt-4"><label class="form-label" for="email">Email</label><input required autocomplete="username" class="form-control mb-3" id="email" name="email" type="email" placeholder="you@example.com"><label class="form-label" for="password">Mật khẩu</label><input required autocomplete="current-password" class="form-control mb-3" id="password" name="password" type="password"><p id="login-error" role="alert" class="text-danger"></p><button id="login-submit" class="btn btn-warning w-100">Đăng nhập <span aria-hidden="true">→</span></button></form>{% if show_demo_accounts %}{% endif %}</div>{% endblock %}{% block scripts %}<script>const form=document.getElementById('login-form'),submit=document.getElementById('login-submit');document.querySelectorAll('.quick').forEach(b=>b.addEventListener('click',()=>{form.elements.email.value=b.dataset.email;form.elements.password.value=b.dataset.password;form.requestSubmit()}));form.addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('login-error');error.textContent='';submit.disabled=true;submit.textContent='Đang đăng nhập...';try{const r=await fetch('{{ url_for("auth.login") }}',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':{{ session.csrf_token|tojson }}},body:JSON.stringify({email:form.elements.email.value,password:form.elements.password.value})});const d=await r.json();if(!r.ok){error.textContent=d.error||'Không thể đăng nhập';submit.disabled=false;submit.textContent='Đăng nhập →';return}location.href=d.role==='ADMIN'?'{{ url_for("pages.dashboard") }}':d.role==='STAFF'?'{{ url_for("pages.staff") }}':'{{ url_for("pages.index") }}'}catch(_){error.textContent='Không kết nối được máy chủ.';submit.disabled=false;submit.textContent='Đăng nhập →'}});</script>{% endblock %}
