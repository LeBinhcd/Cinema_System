<aside id="cinema-chat" class="cinema-chat" aria-label="Tư vấn điện ảnh">
  <button id="chat-toggle" class="cinema-chat__fab" type="button" aria-label="Mở trợ lý điện ảnh" aria-expanded="false" aria-controls="chat-panel" hidden>✦</button>
  <section id="chat-panel" class="cinema-chat__panel" aria-labelledby="chat-title" hidden>
    <header class="cinema-chat__header">
      <div><h2 id="chat-title">Trợ lý Điện ảnh AI</h2><span>Tìm phim · Lịch chiếu · Ghế trống</span></div>
      <button id="chat-close" class="cinema-chat__close" type="button" aria-label="Thu nhỏ cửa sổ chat">×</button>
    </header>
    <div id="chat-history" class="cinema-chat__history" role="log" aria-live="polite" aria-relevant="additions" tabindex="0" aria-label="Lịch sử trò chuyện">
      <div class="cinema-chat__message cinema-chat__message--assistant">Xin chào! Tôi có thể giúp bạn tìm phim và suất chiếu. Bạn muốn xem phim gì?</div>
    </div>
    <p id="chat-loading" class="cinema-chat__loading" role="status" hidden>Đang tìm kiếm suất chiếu...</p>
    <form id="chat-form" class="cinema-chat__form" novalidate>
      <label for="chat-question" class="cinema-chat__label">Câu hỏi của bạn</label>
      <div class="cinema-chat__input-row">
        <textarea id="chat-question" rows="2" maxlength="300" placeholder="Tối nay có phim gì?" aria-describedby="chat-count chat-validation"></textarea>
        <button id="chat-send" type="submit" class="cinema-chat__send">Gửi</button>
      </div>
      <div class="cinema-chat__form-meta"><span id="chat-validation" role="status"></span><span id="chat-count">0/300</span></div>
    </form>
    <p class="cinema-chat__note">Ghế trống có thể thay đổi. Đặt vé sẽ kiểm tra lại tình trạng ghế.</p>
  </section>
</aside>
